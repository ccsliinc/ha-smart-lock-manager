name: Validate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Validate manifest
      run: |
        python -c "
        import json
        with open('custom_components/smart_lock_manager/manifest.json') as f:
            manifest = json.load(f)
            print(f'✅ Manifest valid: {manifest[\"name\"]} v{manifest[\"version\"]}')
            required_fields = ['domain', 'name', 'version', 'documentation', 'issue_tracker', 'codeowners']
            for field in required_fields:
                if field not in manifest:
                    raise ValueError(f'Missing required field: {field}')
            print('✅ All required manifest fields present')
        "

    - name: Validate Python syntax
      run: |
        find custom_components/smart_lock_manager -name "*.py" -exec python -m py_compile {} \;
        echo "✅ Python syntax validation passed"

    - name: Test imports
      run: |
        cd custom_components/smart_lock_manager
        python -c "
        try:
            from const import DOMAIN, VERSION
            print(f'✅ Smart Lock Manager v{VERSION} imports successfully')
        except ImportError as e:
            print(f'❌ Import error: {e}')
            exit(1)
        "

    - name: Run security scan (Bandit)
      run: |
        pip install bandit
        bandit -r custom_components/smart_lock_manager/ -f json -o bandit-report.json || true
        bandit -r custom_components/smart_lock_manager/ -ll
        echo "✅ Security scan completed"

    - name: Run tests
      run: |
        # Run against the integration's OWN target HA (manifest version
        # 2026.8.0), NOT a years-old release, so the suite exercises the same
        # zwave_js helper layout the integration actually ships against. HA
        # 2026.8.x requires Python >=3.14.2 (hence the 3.14 setup above).
        # zwave-js-server-python is the zwave_js component's runtime requirement
        # (pip install homeassistant does not pull integration requirements);
        # it must be present for ZWAVE_JS_AVAILABLE to bind True so the zwave
        # service tests can patch async_get_node_from_entity_id / get_usercode.
        # It is pinned to 0.73.0 to match HA 2026.8.x's manifest; 0.67.1 is
        # INCOMPATIBLE (ImportError: BatteryNotification).
        pip install "homeassistant==2026.8.2" "pytest-homeassistant-custom-component==0.13.356" "zwave-js-server-python==0.73.0"
        pip install pytest pytest-asyncio pytest-cov
        pytest tests/ --asyncio-mode=auto
        echo "✅ Test suite passed"

    - name: Validate HACS
      run: |
        python -c "
        import json
        with open('hacs.json') as f:
            hacs = json.load(f)
            print(f'✅ HACS config valid: {hacs[\"name\"]}')
            required = ['name']
            for field in required:
                if field not in hacs:
                    raise ValueError(f'Missing HACS field: {field}')
            disallowed = ['domains', 'iot_class', 'version']
            for field in disallowed:
                if field in hacs:
                    raise ValueError(f'Disallowed HACS field present: {field}')
        "
        echo "✅ HACS validation passed"

  tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-tests-${{ hashFiles('pyproject.toml', 'requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-tests-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Pin homeassistant + pytest-homeassistant-custom-component to the
        # integration's OWN target (manifest version 2026.8.0). Pinning stops
        # pip backtracking to an old homeassistant whose zwave_js helper layout
        # differs and breaks module-level patching. HA 2026.8.x requires Python
        # >=3.14.2 (hence the 3.14 setup above).
        # zwave-js-server-python is the zwave_js component's runtime requirement
        # (pip install homeassistant does not pull integration requirements);
        # without it the lazy import of async_get_node_from_entity_id fails and
        # the zwave service tests cannot patch that symbol. Pinned to 0.73.0 to
        # match HA 2026.8.x; 0.67.1 is INCOMPATIBLE (ImportError:
        # BatteryNotification).
        pip install "homeassistant==2026.8.2" "pytest-homeassistant-custom-component==0.13.356" "zwave-js-server-python==0.73.0"
        pip install -e ".[dev]" pytest-cov pytest-asyncio

    - name: Run test suite
      run: |
        pytest tests/ --asyncio-mode=auto
        echo "✅ Test suite passed"
